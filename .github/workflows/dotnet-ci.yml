name: .NET CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore ClinicManager/ClinicManager.slnx

      - name: Build
        run: dotnet build ClinicManager/ClinicManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ClinicManager/ClinicManager.slnx --configuration Release --no-build --verbosity normal
